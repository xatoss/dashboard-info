<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Info</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Dashboard Info</h1>
    </header>

    <main>
      <section id="weather">
        <h2>Weather</h2>

        <label>Introduce la ciudad </label>
        <input type="text" id="city" placeholder="Introduce una ciudad" />
        <button id="btSearch">Buscar</button><br /><br />

        <div>
          <table>
            <thead>
              <tr>
                <th>Ciudad</th>
                <th>Temperatura</th>
                <th>Descripción</th>
                <th>Humedad</th>
                <th>Viento</th>
              </tr>
            </thead>
            <tbody id="renderTable"></tbody>
          </table>
        </div>
      </section>

      <section id="news">
        <h2>News</h2>
        <button id="btBefore">Anterior</button>
        <span id="infoPage">Pagina 1</span>
        <button id="btAfter">Siguiente</button>
        <input type="text" id="searchNew" placeholder="Buscar Noticia" />
        <button id="btSearchNews">Buscar</button>

        <div id="newsContainer"></div>
      </section>
    </main>
    <script src="/config.js"></script>
    <script src="/weatherApp.js"></script>
    <script src="/newsApp.js"></script>
  </body>
</html>
