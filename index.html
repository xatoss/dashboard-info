<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Info</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Dashboard Info</h1>
    </header>

    <main>
      <section id="weather">
        <h2>Weather</h2>

        <label>Introduce la ciudad </label>
        <input type="text" id="city" placeholder="Introduce una ciudad" />
        <button id="btSearch">Buscar</button><br /><br />

        <div>
          <table>
            <thead>
              <tr>
                <th scope="col" id="cityShow">Ciudad</th>
                <th scope="col" id="tem">Temperatura</th>
                <th scope="col" id="des">Descripción</th>
                <th scope="col" id="hum">Humedad</th>
                <th scope="col" id="wind">Viento</th>
              </tr>
            </thead>
            <tbody id="renderTable">
              <tr></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section id="news">
        <h2>News</h2>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
